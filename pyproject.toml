[project]
name = "betbot"
version = "0.1.0"
description = "Tip-driven horse-racing bet automation: Telegram/WhatsApp ingestion, Claude parsing, Betfair validation, rules engine, BF Bot Manager feed, settlement tracking"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "anthropic>=0.40",
    "betfairlightweight>=2.20",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10",
    "rapidfuzz>=3.6",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
betbot = "betbot.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_api: tests that call external APIs (deselect with '-m \"not live_api\"')",
]
