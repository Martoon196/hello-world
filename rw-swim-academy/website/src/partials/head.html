<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{siteUrl}}/{{path}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{siteUrl}}/assets/img/og-image.svg">
<meta property="og:url" content="{{siteUrl}}/{{path}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B2545">
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsActivityLocation",
  "name": "RW Swim Academy",
  "description": "Private swimming lessons in Sevenoaks, Kent, taught by Ruby Waller, a qualified swimming teacher and competitive swimmer.",
  "url": "{{siteUrl}}",
  "email": "hello@rwswimacademy.co.uk",
  "areaServed": ["Sevenoaks", "Tonbridge", "Tunbridge Wells", "Westerham", "Otford", "Kent"],
  "address": {"@type": "PostalAddress", "addressLocality": "Sevenoaks", "addressRegion": "Kent", "addressCountry": "GB"},
  "founder": {"@type": "Person", "name": "Ruby Waller"},
  "sameAs": ["https://www.instagram.com/rubywaller.swims/"]
}
</script>
</head>
<body class="{{bodyClass}}">
